{% extends "notes/base.html" %}
{% load static %}

{% block content %}

<div class="appbar"> 
    <img src="{% static 'notes/img/logo-getit.png' %}" class="logo"/>
    <span class="subtitle">Post-it, mas com outro verbo</span>
</div>
<main class="notes-filtradas"> 
    <div class="card-container">
        {% for note in notes %}
        <div class="card">
            <div class="card-header">
                <h3 class="card-title">{{note.title}}</h3>
            </div>
            <div class="card-content">
                <p>{{note.content}}</p>
            </div>
            <div class="tags">
                <p>{{note.tag.title}}</p>
            </div>
        </div>
        {% endfor %}   
    </div>
</main>
<script type="text/javascript" src="{% static 'notes/getit.js' %}"></script>
{% endblock %}
